<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050b12">
  <meta name="description" content="Ariq Anwar AI Assistant">
  <title>ARIQ ANWAR AI</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <div class="topbar">
      <div>
        <div class="brand">ARIQ ANWAR</div>
        <div class="subtitle">PERSONAL AI ASSISTANT</div>
      </div>
      <div id="statusDot" class="dot"></div>
    </div>

    <section class="core-wrap">
      <div class="ring ring3"></div>
      <div class="ring ring2"></div>
      <div class="ring ring1"></div>
      <div id="core" class="core">
        <div class="core-inner">AA</div>
      </div>
    </section>

    <div id="status" class="status">SIAP</div>
    <div id="heard" class="heard">Tekan mikrofon dan bicara.</div>

    <section id="chat" class="chat" aria-live="polite">
      <div class="msg ai"><b>ARIQ:</b> Halo! Saya siap membantu.</div>
    </section>

    <div class="quick">
      <button data-cmd="Jam berapa sekarang">🕐 Jam</button>
      <button data-cmd="Tanggal hari ini">📅 Tanggal</button>
      <button data-cmd="Buka YouTube">▶ YouTube</button>
      <button data-cmd="Buka Google">🔎 Google</button>
    </div>

    <button id="micBtn" class="mic" aria-label="Mulai bicara">
      <span class="mic-icon">🎙️</span>
    </button>
    <div class="hint">Tekan sekali untuk mulai • tekan lagi untuk berhenti</div>

    <div class="footer">
      <span id="support">Memeriksa dukungan suara…</span>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
