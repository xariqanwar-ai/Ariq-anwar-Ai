<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#02070b">
<meta name="description" content="Ariq Anwar - AI Assistant">
<link rel="manifest" href="manifest.json">
<title>Ariq Anwar</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="stars"></div>
<main>
  <header>
    <div>
      <h1>ARIQ ANWAR</h1>
      <p id="status">● SYSTEM ONLINE</p>
    </div>
    <button id="installBtn" class="small hidden">INSTALL</button>
  </header>

  <section class="core">
    <div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div>
    <div class="core-dot"></div>
    <div class="scan"></div>
  </section>

  <section class="panel">
    <div id="output">Halo. Saya <b>Ariq Anwar</b>.<br>Tekan mikrofon dan bicara.</div>
    <div id="transcript">Siap mendengarkan...</div>
  </section>

  <button id="mic" aria-label="Bicara">
    <span>🎙</span>
  </button>
  <p class="hint">Tekan mikrofon • bicara dalam Bahasa Indonesia</p>

  <section class="commands">
    <button data-command="Halo Ariq Anwar">Halo</button>
    <button data-command="Siapa kamu?">Siapa kamu?</button>
    <button data-command="Jam berapa?">Jam</button>
    <button data-command="Buka YouTube">YouTube</button>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
