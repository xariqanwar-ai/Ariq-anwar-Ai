<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050816">
  <meta name="description" content="Ariq Anwar AI Assistant V4">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css?v=4">
  <title>Ariq Anwar AI V4</title>
</head>
<body>
  <div class="bg-grid"></div>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <div class="logo"><span>AA</span></div>
        <div>
          <h1>Ariq Anwar</h1>
          <p>AI ASSISTANT <b>V4</b></p>
        </div>
      </div>
      <div class="status"><i></i> ONLINE</div>
    </header>

    <section class="hero">
      <div class="orb-wrap">
        <div class="ring r1"></div><div class="ring r2"></div>
        <div class="orb"><span>AA</span><small>AI</small></div>
      </div>
      <h2>Halo, saya Ariq Anwar</h2>
      <p>Asisten suara berbahasa Indonesia.</p>
      <button id="micBtn" class="mic" aria-label="Mulai bicara">🎙️</button>
      <div id="listenState" class="listen">Tekan mikrofon untuk berbicara</div>
    </section>

    <section id="chat" class="chat" aria-live="polite"></section>

    <section class="quick">
      <button data-cmd="Halo">👋 Halo</button>
      <button data-cmd="Jam berapa sekarang">🕐 Jam</button>
      <button data-cmd="Buka YouTube">▶️ YouTube</button>
      <button data-cmd="Buka TikTok">🎵 TikTok</button>
      <button data-cmd="Buka Minecraft">⛏️ Minecraft</button>
      <button data-cmd="Buka Blockman GO">🎮 Blockman GO</button>
    </section>

    <form id="form" class="inputbar">
      <input id="input" autocomplete="off" placeholder="Ketik perintah..." />
      <button type="submit">➤</button>
    </form>

    <button id="installBtn" class="install hidden">📲 Pasang Ariq Anwar di HP</button>
    <footer>V4 • HTML + JavaScript • GitHub Pages</footer>
  </main>
  <script src="app.js?v=4"></script>
</body>
</html>
